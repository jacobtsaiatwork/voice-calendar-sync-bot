services:
  - type: web
    name: voice-calendar-sync-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEFAULT_TIMEZONE
        value: Asia/Taipei
      - key: DATABASE_URL
        value: sqlite:///./voice_calendar_sync.db
